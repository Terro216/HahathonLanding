worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' https://analytics.ilyamedve.dev; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src https://analytics.ilyamedve.dev; form-action 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location = /healthz { default_type text/plain; return 200 "ok\n"; }
        location = / { expires -1; try_files /index.html =404; }
        location = /index.html { expires -1; }
        location ~ /\. { return 404; }
        location ~* \.(?:map|pug|scss)$ { return 404; }
        location / { try_files $uri =404; }
    }
}
